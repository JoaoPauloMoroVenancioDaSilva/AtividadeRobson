<!-- agendamento.html -->
<button type="button" class="btn btn-primary" onclick="IncluirAgendamento()">
  Incluir Agendamento
</button>

<div class="modal fade" id="staticBackdrop" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5">Gerenciar Agendamentos</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="row col-12">
          <div class="col-md-4">
            <label for="inputId" class="form-label">ID</label>
            <input type="number" class="form-control" id="inputId" />
          </div>
          <div class="col-md-8">
            <label for="inputData" class="form-label">Data e hora</label>
            <input type="datetime-local" class="form-control" id="inputData" />
          </div>
        </div>
        <div class="row col-12">
          <div class="col-md-12">
            <label for="selPessoa" class="form-label">Pessoa (tutor)</label>
            <select class="form-select" id="selPessoa"></select>
          </div>
          <div class="col-md-6">
            <label for="selPet" class="form-label">Pet</label>
            <select class="form-select" id="selPet"></select>
          </div>
          <div class="col-md-6">
            <label for="selLocal" class="form-label">Local</label>
            <select class="form-select" id="selLocal"></select>
          </div>
          <div class="col-md-12">
            <label for="inputDescricao" class="form-label">Descrição</label>
            <input type="text" class="form-control" id="inputDescricao" placeholder="Ex.: Banho e tosa, Consulta, Passeio" />
          </div>
        </div>
        <div class="modal-footer mt-2">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" data-bs-dismiss="modal" onclick="gravarDados()">Gravar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="mt-4">
  <table class="table table-striped" id="tabelaAgendamento">
    <thead>
      <tr><th>ID</th><th>Data</th><th>Pessoa</th><th>Pet</th><th>Local</th><th>Descrição</th><th>Ações</th></tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
