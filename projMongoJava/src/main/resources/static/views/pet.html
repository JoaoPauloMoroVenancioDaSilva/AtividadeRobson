<button type="button" class="btn btn-primary" onclick="IncluirPet()">
  Incluir Pet
</button>

<div class="modal fade" id="modalPet" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="modalPetLabel" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h1 class="modal-title fs-5" id="modalPetLabel">Gerenciar Pets</h1>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body">
        <div class="row col-12">
          <div class="col-md-4">
            <label for="inputId" class="form-label">ID</label>
            <input type="number" class="form-control" id="inputId" disabled />
          </div>
          <div class="col-md-8">
            <label for="inputNome" class="form-label">Nome</label>
            <input type="text" class="form-control" id="inputNome" required />
          </div>
        </div>
        <div class="row col-12">
          <div class="col-md-6">
            <label for="inputRaca" class="form-label">Raça</label>
            <input type="text" class="form-control" id="inputRaca" placeholder="Ex.: Vira-lata, Poodle" required />
          </div>
          <div class="col-md-6">
            <label for="inputIdade" class="form-label">Nascimento / Idade</label>
            <input type="date" class="form-control" id="inputIdade" required />
          </div>
        </div>
        <div class="modal-footer mt-2">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
          <button type="button" class="btn btn-primary" onclick="gravarDados()">Gravar</button>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="mt-4">
  <table class="table table-striped" id="tabelaPet">
    <thead>
    <tr>
      <th>ID</th><th>Nome</th><th>Raça</th><th>Idade</th><th>Ações</th>
    </tr>
    </thead>
    <tbody></tbody>
  </table>
</div>
